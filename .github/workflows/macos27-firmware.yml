name: macos27-firmware

# macOS-only step: the sheng preflight extracts the vendor blobs out of the Xiaomi
# fastboot archive with a Mach-O uefiextract binary, so the Mu-Silicium firmware
# volume is built here and the resulting .fd is published for the boot image.

on:
  workflow_dispatch:
    inputs:
      unixnu_ref: {description: UniXNU commit, required: true, default: 2bc89720371e42dd07eaefe5f8a6c08111aeb300}
      device_ref: {description: UniXNU-sheng commit, required: true, default: 9f5f0fb090a2ca87749941d51d7ac7b38b717008}
      uefi_ref: {description: uefi-sheng commit, required: true, default: 20a05fd}

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 300
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {repository: UniXNU/UniXNU, ref: "${{ inputs.unixnu_ref }}", path: UniXNU, fetch-depth: 0, submodules: recursive}
      - uses: actions/checkout@v4
        with: {repository: UniXNU/UniXNU-sheng, ref: "${{ inputs.device_ref }}", path: UniXNU-sheng, fetch-depth: 0, submodules: recursive}
      - uses: actions/checkout@v4
        with: {repository: UniXNU/uefi-sheng, ref: "${{ inputs.uefi_ref }}", path: uefi-sheng, fetch-depth: 0}
      - name: disk headroom
        run: df -h /
      - name: toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          python3 -V; (command -v dtc || brew install dtc) >/dev/null
      - name: defconfig
        run: |
          cd UniXNU
          ./unixnu defconfig sheng_macos_defconfig -D ../UniXNU-sheng --os macos-27
          ./unixnu status --json -D ../UniXNU-sheng --os macos-27 > status.json
      - name: build firmware
        run: |
          cd UniXNU
          time ./unixnu build firmware --os macos-27 -D ../UniXNU-sheng --uefi ../uefi-sheng
      - name: collect
        if: always()
        run: |
          cd UniXNU
          OUTDIR=$(python3 -c "import json;print(json.load(open('status.json'))['output'])")
          DEST="$RUNNER_TEMP/out"; rm -rf "$DEST"; mkdir -p "$DEST"
          find "$OUTDIR" ../uefi-sheng/Build -name '*.fd' -size +1M 2>/dev/null | while read -r fd; do
            cp "$fd" "$DEST/$(basename "$fd")"; done
          cp "$OUTDIR"/logs/*.log "$DEST/" 2>/dev/null || true
          (cd "$DEST" && ls -l && find . -type f -exec shasum -a 256 {} + | tee sha256.txt)
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos27-firmware
          path: ${{ runner.temp }}/out/**
          if-no-files-found: warn
          retention-days: 7
