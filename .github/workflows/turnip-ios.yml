name: turnip-ios
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          path: UniXNU
          submodules: recursive
          fetch-depth: 1
      - name: toolchain
        run: |
          brew install -q meson ninja glslang shaderc bison flex || true
          python3 -m pip install --user --break-system-packages meson ninja
          xcrun --sdk iphoneos --show-sdk-version
      - name: mesa at pin
        run: |
          git clone --filter=blob:none https://gitlab.freedesktop.org/mesa/mesa.git UniXNU/.cache/mesa-work
          cd UniXNU/.cache/mesa-work
          git checkout -q 85fda3b36405bcaea8bffc64aa4f2651dc90770d
          for p in freedreno-tools-nir ir3-darwin-build-id ir3-portable-asm-roundtrip offline-adreno-compiler-probe turnip-darwin-kmd turnip-graphics-cache-feedback turnip-empty-scissor turnip-builtin-shader-pack turnip-host-import-images; do
            git apply ../patches/mesa/$p.patch || git apply ../../patches/mesa/$p.patch
          done
          git status --porcelain | wc -l
      - name: build turnip
        run: |
          export PATH="/opt/homebrew/opt/bison/bin:/opt/homebrew/opt/flex/bin:$PATH"
          bison --version | head -1
          cd UniXNU
          python3 -m venv .cache/mesa-venv
          .cache/mesa-venv/bin/pip install -q meson ninja mako pyyaml packaging
          mkdir -p .cache/mesa-tools/bin
          ln -sf "$PWD/.cache/mesa-venv/bin/meson" .cache/mesa-tools/bin/meson
          ln -sf "$PWD/.cache/mesa-venv/bin/ninja" .cache/mesa-tools/bin/ninja
          set +e
          python3 scripts/build-turnip-darwin.py --target ios
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "=== build log tail ==="
            tail -40 .cache/mesa-tu-ios-build.log 2>/dev/null || true
            exit $rc
          fi
          find build/mesa-tu-ios -name '*.dylib' -o -name '*.a' | head -20
      - name: build host turnip
        run: |
          export PATH="/opt/homebrew/opt/bison/bin:/opt/homebrew/opt/flex/bin:$PATH"
          cd UniXNU
          python3 scripts/build-turnip-darwin.py --target host || { tail -30 .cache/mesa-tu-build.log; exit 1; }
      - name: build plugin
        run: |
          cd UniXNU
          python3 - <<'EOF'
          from pathlib import Path
          p = Path('drivers/Adreno740/tests/hostsim/host_iokit_shim.cpp')
          s = p.read_text()
          if 'proc_selfpid' not in s:
              p.write_text(s + '\nextern "C" int proc_selfpid(void) { return (int)getpid(); }\n')
              print('patched host shim with proc_selfpid')
          EOF
          python3 scripts/build-adreno-metal-plugin.py
          ls -la build/adreno-metal-plugin || true
      - uses: actions/upload-artifact@v4
        with:
          name: turnip-ios
          path: |
            UniXNU/build/mesa-tu-ios
            UniXNU/build/adreno-metal-plugin
          if-no-files-found: warn
