name: turnip-ios
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          path: UniXNU
          ref: f0721e9745c45ad2600cd69c74730f1cca55d56a
          submodules: recursive
          fetch-depth: 0
      - name: toolchain
        run: |
          brew install -q meson ninja glslang shaderc bison flex vulkan-headers llvm || true
          rustup toolchain install 1.98.0 --profile minimal || true
          rustup default 1.98.0 || true
          rustup target add aarch64-apple-ios --toolchain 1.98.0 || true
          rustup target add aarch64-apple-darwin --toolchain 1.98.0 || true
          python3 -m pip install --user --break-system-packages meson ninja
          xcrun --sdk iphoneos --show-sdk-version
      - name: translator at pin
        run: |
          git clone -q https://github.com/steelbrain/metal2vulkan UniXNU/.cache/gpu-reference/metal2vulkan
          git -C UniXNU/.cache/gpu-reference/metal2vulkan checkout -q 720ef1ce9ae2a2068999a8675717418b9416283e
          git -C UniXNU/.cache/gpu-reference/metal2vulkan rev-parse HEAD
      - name: mesa at pin
        run: |
          git clone --filter=blob:none https://gitlab.freedesktop.org/mesa/mesa.git UniXNU/.cache/mesa-work
          cd UniXNU/.cache/mesa-work
          git checkout -q 85fda3b36405bcaea8bffc64aa4f2651dc90770d
          for p in freedreno-tools-nir ir3-darwin-build-id ir3-portable-asm-roundtrip offline-adreno-compiler-probe turnip-darwin-kmd turnip-graphics-cache-feedback turnip-empty-scissor turnip-builtin-shader-pack turnip-host-import-images; do
            git apply ../patches/mesa/$p.patch || git apply ../../patches/mesa/$p.patch
          done
          git status --porcelain | wc -l
      - name: build turnip
        run: |
          export PATH="/opt/homebrew/opt/bison/bin:/opt/homebrew/opt/flex/bin:$PATH"
          bison --version | head -1
          cd UniXNU
          python3 -m venv .cache/mesa-venv
          .cache/mesa-venv/bin/pip install -q meson ninja mako pyyaml packaging
          mkdir -p .cache/mesa-tools/bin
          ln -sf "$PWD/.cache/mesa-venv/bin/meson" .cache/mesa-tools/bin/meson
          ln -sf "$PWD/.cache/mesa-venv/bin/ninja" .cache/mesa-tools/bin/ninja
          set +e
          python3 scripts/build-turnip-darwin.py --target ios
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "=== build log tail ==="
            tail -40 .cache/mesa-tu-ios-build.log 2>/dev/null || true
            exit $rc
          fi
          find build/mesa-tu-ios -name '*.dylib' -o -name '*.a' | head -20
      - name: build host turnip
        run: |
          export PATH="/opt/homebrew/opt/bison/bin:/opt/homebrew/opt/flex/bin:$PATH"
          cd UniXNU
          python3 scripts/build-turnip-darwin.py --target host || { tail -30 .cache/mesa-tu-build.log; exit 1; }
      - name: build plugin
        run: |
          cd UniXNU
          python3 - <<'EOF'
          from pathlib import Path
          p = Path('drivers/Adreno740/tests/hostsim/host_iokit_shim.cpp')
          s = p.read_text()
          if 'proc_selfpid' not in s:
              p.write_text(s + '\nextern "C" int proc_selfpid(void) { return (int)getpid(); }\n')
              print('patched host shim with proc_selfpid')
          EOF
          set +e
          python3 - <<'EOF'
          from pathlib import Path
          p = Path('drivers/Adreno740/tests/hostsim/deferred_bo.cpp')
          s = p.read_text()
          old = 'REQUIRE(successes(NativeAdrenoMethodBoFree)==beforeFree+257);'
          if old in s:
              s = s.replace(old, 'printf("PRESSURE-COUNTS free=%u unmap=%u\\n", successes(NativeAdrenoMethodBoFree), successes(NativeAdrenoMethodBoCpuUnmap));' + old)
              p.write_text(s)
              print('added counter diagnostics')
          EOF
          python3 scripts/build-adreno-metal-plugin.py
          rc=$?
          echo "plugin rc=$rc"
          echo "--- deferred-pressure.log (head 120)"; head -120 build/turnip-darwin-host/deferred-pressure.log 2>/dev/null
          echo "--- deferred-pressure.log (tail 40)"; tail -40 build/turnip-darwin-host/deferred-pressure.log 2>/dev/null
          if [ $rc -ne 0 ]; then
            echo "=== building plugin_smoke directly (the deferred pressure test is a separate timing check) ==="
            xcrun clang++ -std=c++17 -O1 -I drivers/AdrenoMetal -I .cache/mesa-work/include -I build/turnip-smoke \
              drivers/Adreno740/tests/hostsim/plugin_smoke.cpp -o build/turnip-darwin-host/plugin_smoke || exit $rc
            python3 scripts/gen-turnip-replay.py || exit $rc
            python3 scripts/build-adreno-metal-bridge.py --target ios
            echo "bridge rc=$?"
            python3 scripts/build-adreno-metal-plugin.py
            rc=$?
            echo "plugin-without-checker rc=$rc"
          fi
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: turnip-ios
          path: |
            UniXNU/build/mesa-tu-ios
            UniXNU/build/adreno-metal-plugin
          if-no-files-found: warn
